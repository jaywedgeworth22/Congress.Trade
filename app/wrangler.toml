name = "congress-feed"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Custom domains. The congress.trade zone must be active on this Cloudflare
# account (it is). `wrangler deploy` provisions the cert + DNS automatically.
# Remove a line / set workers_dev=false later if you want to lock to the domain.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "congress.trade", custom_domain = true },
  { pattern = "www.congress.trade", custom_domain = true }
]

# ---------------------------------------------------------------------------
# Cron Triggers
# Fires every minute. The watcher decides INTERNALLY (via shouldPollNow) whether
# to actually poll, based on poll_config schedule + last poll time. This keeps
# the polling cadence hot-configurable without redeploying.
# ---------------------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# D1 (SQLite) — primary structured store
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "congress-feed-db"
database_id = "b4618a12-5c2d-4384-9762-61ad792db5af"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# R2 — raw disclosure file storage (PDFs / HTML snapshots)
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "RAW_FILES"
bucket_name = "congress-feed-raw"

# ---------------------------------------------------------------------------
# Queues — producers + consumers
# INGEST_QUEUE   : filing.new / filing.fetched / filing.extracted / tx.persisted
# DELIVERY_QUEUE : delivery.dispatch
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "congress-feed-ingest"

[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "congress-feed-delivery"

[[queues.consumers]]
queue = "congress-feed-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "congress-feed-ingest-dlq"

[[queues.consumers]]
queue = "congress-feed-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 8
dead_letter_queue = "congress-feed-delivery-dlq"

# ---------------------------------------------------------------------------
# KV — hot config cache (poll schedule, feature flags)
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "b5554a8cd8b04347baeb80cd160bf1e0"

# ---------------------------------------------------------------------------
# Secrets / vars (set via `wrangler secret put <NAME>` or `.dev.vars` locally)
# — DO NOT commit real values. See `.dev.vars.example` for the full matrix:
#   ADMIN_TOKEN / INGEST_TOKEN and optional Cloudflare Access vars
#   GEMINI_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY / ARBITRATION_API_KEY
#   FMP_API_KEY / FMP_DAILY_CALL_CAP
#   WEBHOOK_SIGNING_KEY
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / RESEND_API_KEY / EMAIL_FROM
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / STRIPE_PRICE_*
# ---------------------------------------------------------------------------
# [vars]
# (non-secret vars go here)
