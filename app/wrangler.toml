name = "congress-trade"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

# Worker service name is `congress-trade`. Some backing resources below still
# use the original `congress-feed-*` names; do not rename D1/R2/queues without a
# deliberate resource migration.

# ---------------------------------------------------------------------------
# Worker runtime limits
# Paid Workers can run materially larger admin/import jobs than the free plan.
# Keep explicit ceilings so a bad import cannot turn into an unbounded bill.
# To run this same Worker on a lean/free-compatible profile later, lower or
# remove this block and set the IMPORT_* vars below to smaller batches.
# ---------------------------------------------------------------------------
[limits]
cpu_ms = 300_000
subrequests = 10_000

# ---------------------------------------------------------------------------
# Custom domains. The congress.trade zone must be active on this Cloudflare
# account (it is). `wrangler deploy` provisions the cert + DNS automatically.
# Remove a line / set workers_dev=false later if you want to lock to the domain.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "congress.trade", custom_domain = true },
  { pattern = "www.congress.trade", custom_domain = true },
  { pattern = "admin.congress.trade", custom_domain = true }
]

# ---------------------------------------------------------------------------
# Observability
# Keep this in config so dashboard changes are not overwritten on deploy.
# Invocation logs are useful while the app is ingesting/backfilling and while
# the error rate is being investigated.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.05

# ---------------------------------------------------------------------------
# Smart Placement
# The Worker makes round trips to D1 plus external filing/market/email APIs.
# Let Cloudflare place invocations where those round trips are fastest.
# ---------------------------------------------------------------------------
[placement]
mode = "smart"

# ---------------------------------------------------------------------------
# Sentry release detection
# Exposes the deployed Worker version to the Sentry Cloudflare SDK so error
# events are tagged with a release automatically (no manual release string to
# keep in sync). See src/index.ts / Sentry.withSentry.
# ---------------------------------------------------------------------------
[version_metadata]
binding = "CF_VERSION_METADATA"

# ---------------------------------------------------------------------------
# Cron Triggers
# Fires every minute. The watcher decides INTERNALLY (via shouldPollNow) whether
# to actually poll, based on poll_config schedule + last poll time. This keeps
# the polling cadence hot-configurable without redeploying.
# ---------------------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# D1 (SQLite) — primary structured store
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "congress-feed-db"
database_id = "b4618a12-5c2d-4384-9762-61ad792db5af"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# R2 — raw disclosure file storage (PDFs / HTML snapshots)
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "RAW_FILES"
bucket_name = "congress-feed-raw"

# ---------------------------------------------------------------------------
# Queues — producers + consumers
# INGEST_QUEUE   : filing.new / filing.fetched / filing.extracted / tx.persisted
# DELIVERY_QUEUE : delivery.dispatch
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "congress-feed-ingest"

[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "congress-feed-delivery"

[[queues.consumers]]
queue = "congress-feed-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "congress-feed-ingest-dlq"

[[queues.consumers]]
queue = "congress-feed-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 8
dead_letter_queue = "congress-feed-delivery-dlq"

# DLQs are actively consumed: the Worker durably records the terminal receipt,
# reopens the owning outbox row, then ACKs. High retry count protects recovery
# from a transient D1 outage without recursively dead-lettering a DLQ.
[[queues.consumers]]
queue = "congress-feed-ingest-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 100

[[queues.consumers]]
queue = "congress-feed-delivery-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 100

# ---------------------------------------------------------------------------
# KV — hot config cache (poll schedule, feature flags)
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "b5554a8cd8b04347baeb80cd160bf1e0"

# ---------------------------------------------------------------------------
# Secrets / vars (set via Infisical runtime resolver, `wrangler secret put
# <NAME>`, or `.dev.vars` locally) — DO NOT commit real values. See
# `.dev.vars.example` for the full matrix:
#   INFISICAL_APP_* / INFISICAL_SHARED_* machine identity bootstrap credentials
#   ADMIN_TOKEN / INGEST_TOKEN and optional Cloudflare Access vars
#   GEMINI_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY / ARBITRATION_API_KEY
#   FMP_API_KEY / FMP_DAILY_CALL_CAP
#   WEBHOOK_SIGNING_KEY
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / RESEND_API_KEY / EMAIL_FROM
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / STRIPE_PRICE_*
#   USAGE_MONITOR_INGEST_URL / USAGE_MONITOR_INGEST_TOKEN
# ---------------------------------------------------------------------------
[vars]
APP_BASE_URL = "https://congress.trade"
# Autonomous cross-vendor agreement -> auto-publish (per-minute cron). When two
# independent models fully agree on a held-for-review filing's rows, it's
# published instead of waiting for a human. Bounded: LIMIT docs/tick, each doc
# attempted once. Set ENABLED to "" to turn off.
# MODEL_B was "openai:gpt-4o-mini" from 2026-06-26 to 2026-07-10 -- confirmed
# via prod review_queue data to have been effectively non-functional that
# whole window (bakeoff.ts:38 already documented gpt-4o-mini rejecting this
# PDF-as-file-part payload shape outright; only successes were rollout-window
# artifacts). Switched to the bake-off-proven-working full gpt-4o.
AGREEMENT_AUTOPUBLISH_ENABLED = "true"
AGREEMENT_AUTOPUBLISH_MODEL_A = "mistral:mistral-ocr-latest"
AGREEMENT_AUTOPUBLISH_MODEL_B = "openai:gpt-4o"
AGREEMENT_AUTOPUBLISH_LIMIT = "3"
# Paid-plan import guardrails. These are deliberately below platform maximums:
# large enough to avoid tiny cross-app chunks, still bounded against runaway
# JSON parse/DB-batch cost. Lower these vars for a lean/free-compatible profile.
IMPORT_MAX_BYTES = "1500000"
IMPORT_MAX_REFS = "2000"
IMPORT_MAX_SPX = "5000"
IMPORT_MAX_PRICES = "100"
IMPORT_MAX_CLOSES_PER_TICKER = "1500"
IMPORT_MAX_INSIDER = "5000"
IMPORT_MAX_SHORT_VOLUME = "5000"
# FMP paid tier (Starter = 300 calls/min). Raise the daily enrichment/price
# ceiling well above the free-tier default (230) and pace under the per-minute
# limit, so the daily job uses the paid headroom without tripping 429s. Each
# run stays within Cloudflare's per-invocation subrequest budget; the backlog
# clears across at most a couple runs.
FMP_DAILY_CALL_CAP = "1000"
FMP_MAX_PER_MINUTE = "250"
# Price-history source: "fmp" (default) or "massive" (Polygon aggregates,
# unlimited on the paid plan, not metered against the FMP budget). Flip to A/B.
PRICE_PROVIDER = "fmp"
# Disclosure-latency watch: each cron tick, poll FMP's latest disclosures and
# match them against candidates (created by ingestion + the residential detection
# scout via POST /api/ingest/detection) to measure who surfaced each filing
# first. Enables the FMP-vs-us lead readout that answers the front-running thesis.
DISCLOSURE_LATENCY_WATCH_ENABLED = "true"
# API Usage Monitor app telemetry. Token is secret/Infisical-only.
USAGE_MONITOR_INGEST_URL = "https://usage.jays.services/api/ingest/usage"
USAGE_MONITOR_ENVIRONMENT = "production"
# Stripe premium price ids (not secret) — created 2026-06-22 on the live account.
STRIPE_PRICE_MONTHLY = "price_1TlHYBEUQUPhZj0SEzG2Qx68"
STRIPE_PRICE_ANNUAL = "price_1TlHYCEUQUPhZj0SpNVoPb3Z"
# Flip to "true" only after the account is approved for Managed Payments.
STRIPE_MANAGED_PAYMENTS = "false"
# Sentry — tags events with this environment; the Sentry Cloudflare SDK reads
# it from env automatically. SENTRY_DSN itself is a secret (wrangler secret
# put SENTRY_DSN), not set here. Override SENTRY_TRACES_SAMPLE_RATE (0-1) here
# without a redeploy if the default in src/index.ts is too chatty/quiet.
SENTRY_ENVIRONMENT = "production"

# Isolated review deploys use app/wrangler.preview.toml, generated from
# wrangler.preview.example.toml by scripts/provision-preview.sh locally or by
# .github/workflows/deploy-staging.yml in CI. Keep production-only routes and
# cron triggers in this file.
