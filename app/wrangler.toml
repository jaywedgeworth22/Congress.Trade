name = "congress-trade"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

# Worker service name is `congress-trade`. Some backing resources below still
# use the original `congress-feed-*` names; do not rename D1/R2/queues without a
# deliberate resource migration.

# ---------------------------------------------------------------------------
# Worker runtime limits
# Paid Workers can run materially larger admin/import jobs than the free plan.
# Keep explicit ceilings so a bad import cannot turn into an unbounded bill.
# To run this same Worker on a lean/free-compatible profile later, lower or
# remove this block and set the IMPORT_* vars below to smaller batches.
# ---------------------------------------------------------------------------
[limits]
cpu_ms = 300_000
subrequests = 10_000

# ---------------------------------------------------------------------------
# Custom domains. The congress.trade zone must be active on this Cloudflare
# account (it is). `wrangler deploy` provisions the cert + DNS automatically.
# Remove a line / set workers_dev=false later if you want to lock to the domain.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "congress.trade", custom_domain = true },
  { pattern = "www.congress.trade", custom_domain = true },
  { pattern = "admin.congress.trade", custom_domain = true }
]

# ---------------------------------------------------------------------------
# Observability
# Keep this in config so dashboard changes are not overwritten on deploy.
# Invocation logs are useful while the app is ingesting/backfilling and while
# the error rate is being investigated.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.05

# ---------------------------------------------------------------------------
# Smart Placement
# The Worker makes round trips to D1 plus external filing/market/email APIs.
# Let Cloudflare place invocations where those round trips are fastest.
# ---------------------------------------------------------------------------
[placement]
mode = "smart"

# ---------------------------------------------------------------------------
# Sentry release detection
# Exposes the deployed Worker version to the Sentry Cloudflare SDK so error
# events are tagged with a release automatically (no manual release string to
# keep in sync). See src/index.ts / Sentry.withSentry.
# ---------------------------------------------------------------------------
[version_metadata]
binding = "CF_VERSION_METADATA"

# ---------------------------------------------------------------------------
# Cron Triggers
# Fires every minute. The watcher decides INTERNALLY (via shouldPollNow) whether
# to actually poll, based on poll_config schedule + last poll time. This keeps
# the polling cadence hot-configurable without redeploying.
# ---------------------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# D1 (SQLite) — primary structured store
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "congress-feed-db"
database_id = "b4618a12-5c2d-4384-9762-61ad792db5af"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# R2 — raw disclosure file storage (PDFs / HTML snapshots)
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "RAW_FILES"
bucket_name = "congress-feed-raw"

# ---------------------------------------------------------------------------
# Queues — producers + consumers
# INGEST_QUEUE   : filing.new / filing.fetched / filing.extracted / tx.persisted
# DELIVERY_QUEUE : delivery.dispatch
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "congress-feed-ingest"

[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "congress-feed-delivery"

[[queues.consumers]]
queue = "congress-feed-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "congress-feed-ingest-dlq"

[[queues.consumers]]
queue = "congress-feed-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 8
dead_letter_queue = "congress-feed-delivery-dlq"

# DLQs are actively consumed: the Worker durably records the terminal receipt,
# reopens the owning outbox row, then ACKs. High retry count protects recovery
# from a transient D1 outage without recursively dead-lettering a DLQ.
[[queues.consumers]]
queue = "congress-feed-ingest-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 100

[[queues.consumers]]
queue = "congress-feed-delivery-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 100

# ---------------------------------------------------------------------------
# KV — hot config cache (poll schedule, feature flags)
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "b5554a8cd8b04347baeb80cd160bf1e0"

# ---------------------------------------------------------------------------
# Secrets / vars (set via Infisical runtime resolver, `wrangler secret put
# <NAME>`, or `.dev.vars` locally) — DO NOT commit real values. See
# `.dev.vars.example` for the full matrix:
#   INFISICAL_APP_* / INFISICAL_SHARED_* machine identity bootstrap credentials
#   ADMIN_TOKEN / INGEST_TOKEN and optional Cloudflare Access vars
#   GEMINI_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY / ARBITRATION_API_KEY
#   FMP_API_KEY / FMP_DAILY_CALL_CAP
#   WEBHOOK_SIGNING_KEY
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / RESEND_API_KEY / EMAIL_FROM
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / STRIPE_PRICE_*
#   USAGE_MONITOR_INGEST_URL / USAGE_MONITOR_INGEST_TOKEN
# ---------------------------------------------------------------------------
# ── NOTE: Infisical is the single source of truth for config ────────────────
# Every var below (and every Worker secret except the INFISICAL_* bootstrap
# credentials and the Sentry init vars) is read through the Infisical runtime
# resolver: a value set in Infisical ALWAYS overrides the value here, live,
# within the resolver cache TTL (~10 min) and with zero redeploys. Treat this
# block as FALLBACK DEFAULTS — edit knobs in Infisical, not here. Audit which
# source is live per key via GET /api/admin/config-sources; registry in
# app/docs/config-registry.md. Env-only exceptions: SENTRY_ENVIRONMENT (+ DSN /
# traces rate, read synchronously at Worker init) and USAGE_MONITOR_ENVIRONMENT
# as consumed by Sentry-adjacent init paths.
[vars]
APP_BASE_URL = "https://congress.trade"
# Autonomous cross-vendor agreement -> auto-publish (per-minute cron). The
# durable cascade leases due review rows, retries transient failures with
# backoff, and publishes only after the configured cross-vendor checks pass.
# Set ENABLED to "" to turn off.
AGREEMENT_AUTOPUBLISH_ENABLED = "true"

# Executive Models (Highest capability for difficult/mega-filing OGE 278-T handwritten docs)
AGREEMENT_EXEC_MODEL_A = "openrouter:google/gemini-3.5-flash"
AGREEMENT_EXEC_MODEL_B = "openrouter:qwen/qwen3-vl-30b-a3b-instruct"
AGREEMENT_EXEC_MODEL_C = "openrouter:deepseek/deepseek-v4-pro"
AGREEMENT_EXEC_MODEL_D = "openrouter:z-ai/glm-4.6v"
AGREEMENT_EXEC_MODEL_E = "openrouter:qwen/qwen-2.5-72b-instruct"

# House Models (Medium capability for mixed handwritten/typed standard forms)
AGREEMENT_HOUSE_MODEL_A = "openrouter:google/gemini-3.5-flash"
AGREEMENT_HOUSE_MODEL_B = "openrouter:deepseek/deepseek-v4-flash"
AGREEMENT_HOUSE_MODEL_C = "openrouter:qwen/qwen3-vl-30b-a3b-instruct"
AGREEMENT_HOUSE_MODEL_D = "openrouter:z-ai/glm-4.6v"
AGREEMENT_HOUSE_MODEL_E = "openrouter:deepseek/deepseek-v4-pro"

# Senate Models (Lowest capability for easiest HTML/typed docs)
AGREEMENT_SENATE_MODEL_A = "openrouter:google/gemini-2.5-flash-lite"
AGREEMENT_SENATE_MODEL_B = "openrouter:qwen/qwen3-vl-8b-instruct"
AGREEMENT_SENATE_MODEL_C = "openrouter:amazon/nova-lite-v1"
AGREEMENT_SENATE_MODEL_D = "openrouter:deepseek/deepseek-v4-flash"
AGREEMENT_SENATE_MODEL_E = "openrouter:google/gemini-3.5-flash"

# General fallback for any other chamber / untested types
AGREEMENT_AUTOPUBLISH_MODEL_A = "openrouter:google/gemini-3.5-flash"
AGREEMENT_AUTOPUBLISH_MODEL_B = "openrouter:qwen/qwen3-vl-30b-a3b-instruct"
AGREEMENT_MODEL_C = "openrouter:deepseek/deepseek-v4-pro"

AGREEMENT_AUTOPUBLISH_LIMIT = "3"
AGREEMENT_MAX_ATTEMPTS = "3"
AGREEMENT_DAILY_LLM_BUDGET = "300"
AGREEMENT_BIG_DOC_START_TIER2 = "true"
AGREEMENT_BIG_DOC_PAGE_THRESHOLD = "10"
AGREEMENT_BIG_DOC_BYTES_THRESHOLD = "2097152"
# Paid-plan import guardrails. These are deliberately below platform maximums:
# large enough to avoid tiny cross-app chunks, still bounded against runaway
# JSON parse/DB-batch cost. Lower these vars for a lean/free-compatible profile.
IMPORT_MAX_BYTES = "1500000"
IMPORT_MAX_REFS = "2000"
IMPORT_MAX_SPX = "5000"
IMPORT_MAX_PRICES = "100"
IMPORT_MAX_CLOSES_PER_TICKER = "1500"
IMPORT_MAX_INSIDER = "5000"
IMPORT_MAX_SHORT_VOLUME = "5000"
# FMP paid tier (Starter = 300 calls/min). Raise the daily enrichment/price
# ceiling well above the free-tier default (230) and pace under the per-minute
# limit, so the daily job uses the paid headroom without tripping 429s. Each
# run stays within Cloudflare's per-invocation subrequest budget; the backlog
# clears across at most a couple runs.
# Shared counter: the disclosure-latency probe also draws on this cap (bounded
# to ~576 calls/day = 288 runs x 2 by MIN_PROBE_INTERVAL_SEC). That leaves ~424
# for steady-state enrichment+prices, which only touch newly-traded tickers and
# need far less; large one-off backfills go through the manual /backfill-market
# loop, not this daily cron, so they don't compete with the probe here.
FMP_DAILY_CALL_CAP = "5000"
# 285 not 300: FMP's hard account limit is 300/min. 285 leaves ~5% margin for
# clock/ceil rounding and the fact that the shared pacer only coordinates calls
# within one isolate — concurrent Workers isolates could still overlap.
FMP_MAX_PER_MINUTE = "285"
# SEC EDGAR fair-access policy documents an approx 10 req/s ceiling
# (https://www.sec.gov/os/webmaster-faq#developers). 480/min = 8 req/s (was
# 5 req/s / 300 per min) — owner explicitly chose 8 req/s over the more
# conservative 5 req/s recommendation, still under the ~10 req/s ceiling with
# margin because Cloudflare Workers share egress IPs across tenants, so SEC
# sees aggregate traffic from the shared IP pool, not just this app's calls.
# Separate budget/pacer from FMP_MAX_PER_MINUTE above.
EDGAR_MAX_PER_MINUTE = "480"
# Price-history source: "fmp" (default) or "massive" (Polygon aggregates,
# unlimited on the paid plan, not metered against the FMP budget). Flip to A/B.
PRICE_PROVIDER = "fmp"
# Disclosure-latency watch: each cron tick, poll FMP's latest disclosures and
# match them against candidates (created by ingestion + the residential detection
# scout via POST /api/ingest/detection) to measure who surfaced each filing
# first. Enables the FMP-vs-us lead readout that answers the front-running thesis.
DISCLOSURE_LATENCY_WATCH_ENABLED = "true"
DISCLOSURE_LATENCY_PROVIDERS = "fmp,quiver,unusual_whales"
# Executive-branch (OGE Form 278-T) filings watcher: polls the OGE President/VP
# index (~6h cadence, fail-soft) for new Presidential periodic transaction
# reports and runs them through the normal ingestion pipeline as
# chamber='executive'. Executive rows are EXCLUDED from feed/analytics/
# subscriptions by default (explicit chamber opt-in only). All OGE_* knobs are
# Infisical-tunable.
OGE_WATCH_ENABLED = "true"
# OGE index poll cadence. Deployed explicitly (previously unset, so the code's
# 6h fallback governed and polls drifted to ~6h against a 1h expectation).
OGE_POLL_INTERVAL_SEC = "3600"
# Senate eFD discovery lookback: 7-day base window; the daily deep sweep and
# outage catch-up widen it to SENATE_MAX_LOOKBACK_DAYS (bump temporarily via
# Infisical for a one-off deeper recovery sweep — hard-capped at 365).
SENATE_LOOKBACK_DAYS = "7"
SENATE_MAX_LOOKBACK_DAYS = "30"
# For the first N days of January, also sweep the prior-year House index
# (late-December filings can appear there after the year rolls over).
HOUSE_PRIOR_YEAR_OVERLAP_DAYS = "14"
# Public-API anti-scraping guard (src/security/botDefense.ts): blocks scraper/
# AI-crawler user agents and applies per-IP request + daily row budgets on the
# public data endpoints. Infisical can override SCRAPE_GUARD_ENABLED to "false"
# for a zero-redeploy kill switch if it ever throttles legitimate traffic.
SCRAPE_GUARD_ENABLED = "true"
# API Usage Monitor app telemetry. Token is secret/Infisical-only.
USAGE_MONITOR_INGEST_URL = "https://usage.jays.services/api/ingest/usage"
USAGE_MONITOR_ENVIRONMENT = "production"
# Stripe premium price ids (not secret) — created 2026-06-22 on the live account.
STRIPE_PRICE_MONTHLY = "price_1TsCXWEUQUPhZj0Sk74aiFPu"
STRIPE_PRICE_ANNUAL = "price_1TsCXWEUQUPhZj0ScFElWXUH"
# Flip to "true" only after the account is approved for Managed Payments.
STRIPE_MANAGED_PAYMENTS = "false"
# Sentry — tags events with this environment; the Sentry Cloudflare SDK reads
# it from env automatically. SENTRY_DSN itself is a secret (wrangler secret
# put SENTRY_DSN), not set here. Override SENTRY_TRACES_SAMPLE_RATE (0-1) here
# without a redeploy if the default in src/index.ts is too chatty/quiet.
SENTRY_ENVIRONMENT = "production"

# Isolated review deploys use app/wrangler.preview.toml, generated from
# wrangler.preview.example.toml by scripts/provision-preview.sh locally or by
# .github/workflows/deploy-staging.yml in CI. Keep production-only routes and
# cron triggers in this file.
