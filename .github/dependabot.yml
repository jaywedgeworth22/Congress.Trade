version: 2
updates:
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: daily
      time: "08:00"
    open-pull-requests-limit: 10
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
          - "hono"
      testing:
        patterns:
          - "vitest"
          - "@playwright/*"
