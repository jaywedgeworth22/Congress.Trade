name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + test
    # Fork and Dependabot code must not execute on the persistent Coolify
    # runner. Dependabot updates stay blocked until CI is disposable/ephemeral.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Block dependency-bot code on the persistent runner
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "::error::Dependabot PRs require disposable CI; update on a trusted human branch."
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The persistent workspace may have been left in sparse-checkout mode by
      # an older reporter run. Explicitly restore every tracked path before a
      # step relies on app/ or the workflow-policy script.
      - name: Materialize the full repository checkout
        working-directory: .
        run: |
          git sparse-checkout disable || true
          git reset --hard HEAD
          test -f scripts/check-actions-runner-policy.mjs
          test -d app

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enforce owned-runner workflow policy
        working-directory: .
        run: node scripts/check-actions-runner-policy.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run coverage

      - name: Audit
        run: npm audit

  pwa:
    name: PWA typecheck + test + build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/pwa
    steps:
      - name: Block dependency-bot code on the persistent runner
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "::error::Dependabot PRs require disposable CI; update on a trusted human branch."
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Materialize the full repository checkout
        working-directory: .
        run: |
          git sparse-checkout disable || true
          git reset --hard HEAD
          test -d clients/pwa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
