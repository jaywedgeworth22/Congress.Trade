name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # runs-on is switchable via the CT_CI_RUNNER repository variable:
  # unset/empty -> GitHub-hosted ubuntu-latest; "congress-ci" -> the
  # resource-guarded self-hosted runner on the Hetzner/Coolify box (saves
  # metered Actions minutes). dependabot[bot] PRs always stay on GitHub-hosted
  # runners: they execute third-party dependency install scripts, which must
  # not run on the box that hosts production and a repo-scoped PAT. If the
  # self-hosted runner is down and PRs queue, clear the variable to fall back:
  #   gh variable set CT_CI_RUNNER --body "" (or delete it)
  build:
    name: typecheck + test
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.CT_CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run coverage

      - name: Audit
        run: npm audit

  pwa:
    name: PWA typecheck + test + build
    # Same CT_CI_RUNNER switch (and dependabot carve-out) as the build job above.
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.CT_CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: clients/pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
