name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + test
    # Self-hosted CI with automatic hosted fallback. Set CT_CI_RUNNER repo
    # variable to 'congress-ci' for owned runner, clear/delete for hosted.
    # Dependabot forced to hosted runners for security.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.CT_CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The persistent workspace may have been left in sparse-checkout mode by
      # an older reporter run. Explicitly restore every tracked path before a
      # step relies on app/ or the workflow-policy script.
      - name: Materialize the full repository checkout
        working-directory: .
        run: |
          git sparse-checkout disable || true
          git reset --hard HEAD
          test -f scripts/check-actions-runner-policy.mjs
          test -d app

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Enforce owned-runner workflow policy
        working-directory: .
        run: node scripts/check-actions-runner-policy.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run coverage

      - name: Audit
        run: npm audit

  pwa:
    name: PWA typecheck + test + build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.CT_CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/pwa
    steps:

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Materialize the full repository checkout
        working-directory: .
        run: |
          git sparse-checkout disable || true
          git reset --hard HEAD
          test -d clients/pwa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
