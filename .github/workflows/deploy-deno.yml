name: Deploy Deno

# Deploys burn Deno Deploy quota (build + cold start + revision). Free tier is
# 60 deployments/hour, but each build still costs CPU/wall time — and the old
# hourly schedule alone was 24 deploys/day with no code change.
#
# Policy:
#   - Scheduled deploy once every 3 hours to batch updates and save compute time
#   - Manual workflow_dispatch always allowed
#   - Hard daily cap (default 8 successful Deploy Deno runs/UTC day) so we
#     cannot burn the free quota; set DEPLOY_MAX_PER_DAY repo var to tune

on:
  schedule:
    # Deploy once every 3 hours to batch deployments and save compute time.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Bypass the daily deploy cap (use sparingly)
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-deno
  # Cancel an in-flight deploy if another main push lands — keep latest only.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, congress-deploy]
    steps:
      - name: Enforce daily deploy cap
        id: cap
        env:
          GH_TOKEN: ${{ github.token }}
          # Repo variable optional; default 8 successful deploys per UTC day.
          DEPLOY_MAX_PER_DAY: ${{ vars.DEPLOY_MAX_PER_DAY || '8' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${FORCE}" = "true" ]; then
            echo "Force deploy requested; skipping daily cap."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count completed successful runs of this workflow today (UTC).
          # Use curl (gh CLI may be absent on self-hosted runners).
          since="$(date -u +%Y-%m-%dT00:00:00Z)"
          day="$(date -u +%Y-%m-%d)"
          count="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/deploy-deno.yml/runs?status=completed&per_page=100" \
          | python3 -c "
          import json,sys
          day='${day}'
          data=json.load(sys.stdin)
          n=0
          for r in data.get('workflow_runs',[]):
            if r.get('conclusion') not in ('success','skipped'): continue
            created=(r.get('created_at') or '')[:10]
            if created==day: n+=1
          print(n)
          ")"
          max="${DEPLOY_MAX_PER_DAY}"
          echo "Successful/skipped Deploy Deno runs on ${day} UTC: ${count} (cap ${max})"
          if [ "${count}" -ge "${max}" ]; then
            echo "Daily deploy cap reached (${count} >= ${max}). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.cap.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        if: steps.cap.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Deno CLI
        if: steps.cap.outputs.skip != 'true'
        run: npm install --global deno@2.9.3

      - name: Fetch Secrets from Infisical
        if: steps.cap.outputs.skip != 'true'
        uses: Infisical/secrets-action@6eef259f83b6b4255f9b31e46eba87af4b595c89
        with:
          client-id: ${{ secrets.INFISICAL_CT_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CT_CLIENT_SECRET }}
          env-slug: prod
          project-slug: congress-trade-6-erm

      - name: Install Dependencies
        if: steps.cap.outputs.skip != 'true'
        working-directory: ./app
        run: deno install

      - name: Ensure free-tier cost profile env on Deno Deploy
        if: steps.cap.outputs.skip != 'true'
        working-directory: ./app
        env:
          DENO_DEPLOY_TOKEN: ${{ env.DENO_ORG_TOKEN || env.DENO_PAT }}
        run: |
          set -euo pipefail
          # Deno Deploy rejects env keys starting with DENO_; use CT_*.
          # Prefer update-value; fall back to add if the key is missing.
          if ! deno deploy env update-value CT_COST_PROFILE free \
              --org=congress-trade --app=congress-trade --non-interactive; then
            deno deploy env add CT_COST_PROFILE free \
              --org=congress-trade --app=congress-trade --non-interactive
          fi
          echo "CT_COST_PROFILE=free set on Deno Deploy app"

      - name: Deploy to Deno Deploy and verify
        if: steps.cap.outputs.skip != 'true'
        working-directory: ./app
        run: bash scripts/ship.sh
        env:
          ADMIN_TOKEN: ${{ env.ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          DENO_DEPLOY_TOKEN: ${{ env.DENO_ORG_TOKEN || env.DENO_PAT }}
