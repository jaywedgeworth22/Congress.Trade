name: Deploy Deno

on:
  push:
    branches:
      - main
    paths:
      - 'app/src/**'
      - 'app/deno.json'
      - 'app/package.json'
      - 'app/package-lock.json'
  schedule:
    - cron: '0 * * * *' # Run once an hour
  workflow_dispatch:

concurrency:
  group: deploy-deno
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, congress-deploy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Fetch Secrets from Infisical
        uses: Infisical/secrets-action@6eef259f83b6b4255f9b31e46eba87af4b595c89
        with:
          client-id: ${{ secrets.INFISICAL_CT_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CT_CLIENT_SECRET }}
          env-slug: prod
          project-slug: congress-trade-6-erm

      - name: Install Dependencies
        working-directory: ./app
        run: deno install

      - name: Deploy to Deno Deploy and verify
        working-directory: ./app
        run: bash scripts/ship.sh
        env:
          ADMIN_TOKEN: ${{ env.ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          DENO_DEPLOY_TOKEN: ${{ env.DENO_ORG_TOKEN }}
