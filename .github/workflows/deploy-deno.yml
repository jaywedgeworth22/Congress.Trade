name: Deploy Deno

# Deploys burn Deno Deploy quota (build + cold start + revision). Free tier is
# 60 deployments/hour, but each build still costs CPU/wall time — and the old
# hourly schedule alone was 24 deploys/day with no code change.
#
# Policy:
#   - Scheduled deploy once every 3 hours to batch updates and save compute time
#   - Manual workflow_dispatch always allowed
#   - Hard daily cap (default 8 successful Deploy Deno runs/UTC day) so we
#     cannot burn the free quota; set DEPLOY_MAX_PER_DAY repo var to tune
#   - CT_COST_PROFILE defaults to balanced (override via vars.CT_COST_PROFILE)

on:
  schedule:
    # Deploy once every 3 hours to batch deployments and save compute time.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Bypass the daily deploy cap (use sparingly)
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-deno
  # Cancel an in-flight deploy if another main push lands — keep latest only.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, oracle-ci]
    steps:
      - name: Enforce daily deploy cap
        id: cap
        env:
          GH_TOKEN: ${{ github.token }}
          # Repo variable optional; default 8 successful deploys per UTC day.
          DEPLOY_MAX_PER_DAY: ${{ vars.DEPLOY_MAX_PER_DAY || '8' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${FORCE}" = "true" ]; then
            echo "Force deploy requested; skipping daily cap."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count completed successful runs of this workflow today (UTC).
          # Use curl (gh CLI may be absent on self-hosted runners).
          # Fail OPEN (allow deploy) if GitHub API is unreachable/403 — a broken
          # cap check must not block shipping for days (was red since ~2026-07-25).
          day="$(date -u +%Y-%m-%d)"
          http_code=0
          body_file="$(mktemp)"
          set +e
          http_code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/deploy-deno.yml/runs?status=completed&per_page=100")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "::warning::Deploy cap API check failed (curl_rc=${curl_rc} http=${http_code}); allowing deploy."
            rm -f "$body_file"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          output="$(python3 -c "
          import json,sys,os
          day='${day}'
          data=json.load(open('${body_file}'))
          n=0
          already_deployed='false'
          current_sha=os.environ.get('GITHUB_SHA')
          runs = data.get('workflow_runs',[])
          for r in runs:
            if r.get('conclusion') not in ('success','skipped'): continue
            created=(r.get('created_at') or '')[:10]
            if created==day: n+=1
          for r in runs:
            if r.get('conclusion') == 'success':
              if r.get('head_sha') == current_sha:
                already_deployed='true'
              break
          print(f'{n},{already_deployed}')
          ")"
          rm -f "$body_file"
          count=$(echo "$output" | cut -d',' -f1)
          already_deployed=$(echo "$output" | cut -d',' -f2)
          max="${DEPLOY_MAX_PER_DAY}"
          echo "Successful/skipped Deploy Deno runs on ${day} UTC: ${count} (cap ${max})"
          if [ "${already_deployed}" = "true" ]; then
            echo "Commit ${GITHUB_SHA} was already successfully deployed. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${count}" -ge "${max}" ]; then
            echo "Daily deploy cap reached (${count} >= ${max}). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.cap.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        if: steps.cap.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Deno CLI
        if: steps.cap.outputs.skip != 'true'
        run: npm install --global deno@2.9.3

      - name: Fetch Secrets from Infisical
        if: steps.cap.outputs.skip != 'true'
        uses: Infisical/secrets-action@6eef259f83b6b4255f9b31e46eba87af4b595c89
        with:
          client-id: ${{ secrets.INFISICAL_CT_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CT_CLIENT_SECRET }}
          env-slug: prod
          project-slug: congress-trade-6-erm

      - name: Install Dependencies
        if: steps.cap.outputs.skip != 'true'
        working-directory: ./app
        run: deno install

      - name: Ensure cost profile env on Deno Deploy
        if: steps.cap.outputs.skip != 'true'
        working-directory: ./app
        env:
          DENO_DEPLOY_TOKEN: ${{ env.DENO_ORG_TOKEN || env.DENO_PAT }}
          # Prefer repo var; default balanced so free-tier throttle is opt-in.
          CT_COST_PROFILE: ${{ vars.CT_COST_PROFILE || 'balanced' }}
        run: |
          set -euo pipefail
          # Deno Deploy rejects env keys starting with DENO_; use CT_*.
          profile="${CT_COST_PROFILE}"
          case "$profile" in
            free|balanced|paid) ;;
            *)
              echo "::warning::Unknown CT_COST_PROFILE='$profile'; using balanced"
              profile=balanced
              ;;
          esac
          if ! deno deploy env update-value CT_COST_PROFILE "$profile" \
              --org=congress-trade --app=congress-trade --non-interactive; then
            deno deploy env add CT_COST_PROFILE "$profile" \
              --org=congress-trade --app=congress-trade --non-interactive
          fi
          echo "CT_COST_PROFILE=$profile set on Deno Deploy app"

      - name: Deploy to Deno Deploy and verify
        if: steps.cap.outputs.skip != 'true'
        working-directory: ./app
        run: bash scripts/ship.sh
        env:
          ADMIN_TOKEN: ${{ env.ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          DENO_DEPLOY_TOKEN: ${{ env.DENO_ORG_TOKEN || env.DENO_PAT }}
