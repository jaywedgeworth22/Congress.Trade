name: Deploy Oracle Monolith

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, oracle-ci]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Environment and Secrets
        run: |
          bash scripts/cloud-setup.sh
          cp app/.dev.vars app/.env
          # Ensure CT_COST_PROFILE=paid is set for the monolith!
          echo "CT_COST_PROFILE=paid" >> app/.env

      - name: Build and Deploy via Docker Compose
        run: |
          cd app
          # Make sure the data directory exists
          sudo mkdir -p /data/congress-trade
          sudo chown -R $USER:$USER /data/congress-trade
          
          # Deploy
          docker compose up -d --build
