name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-production to deploy congress.trade"
        required: true
        type: string

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancel it mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy to Cloudflare Workers
        run: bash scripts/ship.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # Consumed by sentry-cli in the postdeploy sourcemap upload. Optional:
          # the postdeploy step fails open when it is absent (see app/package.json).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          WORKERS_DEV_HOST: congress-trade.jaywedgeworth22.workers.dev
