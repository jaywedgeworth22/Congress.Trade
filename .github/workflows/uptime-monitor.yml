name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        id: check
        run: |
          BODY="$(mktemp)"
          HTTP_CODE="000"
          if ! HTTP_CODE="$(curl -sS -o "$BODY" -w "%{http_code}" https://congress.trade/api/health)"; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "http_code=000" >> "$GITHUB_OUTPUT"
            echo "reason=curl failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "reason=unexpected HTTP status" >> "$GITHUB_OUTPUT"
          elif ! REASON="$(node - "$BODY" <<'NODE'
          const fs = require('node:fs');
          const body = fs.readFileSync(process.argv[2], 'utf8');
          let health;
          try {
            health = JSON.parse(body);
          } catch {
            console.log('health response is not valid JSON');
            process.exit(1);
          }
          if (health.ok !== true) {
            console.log('health.ok is not true');
            process.exit(1);
          }
          if (health.db !== true) {
            console.log('health.db is not true');
            process.exit(1);
          }
          console.log('ok');
          NODE
          )"; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "reason=ok" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "health_body<<EOF"
            cat "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: steps.check.outputs.status == 'fail'
        run: |
          title="Uptime Alert: congress.trade health returned HTTP ${{ steps.check.outputs.http_code }}"
          body_file="$(mktemp)"
          now="$(date -u)"
          cat > "$body_file" <<EOF
          Health check failed at ${now}.

          HTTP status: ${{ steps.check.outputs.http_code }}
          Reason: ${{ steps.check.outputs.reason }}

          Body:
          ${{ steps.check.outputs.health_body }}
          EOF
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label incident --search "congress.trade health" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label "incident" \
              --body-file "$body_file"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
