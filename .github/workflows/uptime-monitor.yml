name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: true

jobs:
  ping:
    runs-on: [self-hosted, congress-ci]
    timeout-minutes: 5
    steps:
      - name: Set up Node for health-response validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Health check
        id: check
        run: |
          BODY="$(mktemp)"
          HTTP_CODE="000"
          STATUS="fail"
          REASON="curl failed"
          if HTTP_CODE="$(curl -sS --connect-timeout 10 --max-time 30 -o "$BODY" -w "%{http_code}" https://congress.trade/api/health)"; then
            if [ "$HTTP_CODE" != "200" ]; then
              REASON="unexpected HTTP status"
            elif REASON="$(node - "$BODY" <<'NODE'
          const fs = require('node:fs');
          const body = fs.readFileSync(process.argv[2], 'utf8');
          let health;
          try {
            health = JSON.parse(body);
          } catch {
            console.log('health response is not valid JSON');
            process.exit(1);
          }
          if (health.ok !== true) {
            console.log('health.ok is not true');
            process.exit(1);
          }
          if (health.db !== true) {
            console.log('health.db is not true');
            process.exit(1);
          }
          console.log('ok');
          NODE
            )"; then
              STATUS="ok"
              REASON="ok"
            fi
          fi
          delimiter="$(openssl rand -hex 8)"
          {
            echo "status=$STATUS"
            echo "http_code=$HTTP_CODE"
            echo "reason=$REASON"
            echo "health_body<<$delimiter"
            cat "$BODY"
            # curl writes compact JSON without a trailing newline. Force one so the
            # GitHub-output terminator always starts on its own line.
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: steps.check.outputs.status == 'fail'
        env:
          HEALTH_HTTP_CODE: ${{ steps.check.outputs.http_code }}
          HEALTH_REASON: ${{ steps.check.outputs.reason }}
          HEALTH_BODY: ${{ steps.check.outputs.health_body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Uptime Alert: congress.trade health returned HTTP ${HEALTH_HTTP_CODE}"
          body_file="$(mktemp)"
          now="$(date -u)"
          {
            printf 'Health check failed at %s.\n\n' "$now"
            printf 'HTTP status: %s\n' "$HEALTH_HTTP_CODE"
            printf 'Reason: %s\n\n' "$HEALTH_REASON"
            printf 'Body:\n%s\n' "$HEALTH_BODY"
          } > "$body_file"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label incident --search "congress.trade health" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label "incident" \
              --body-file "$body_file"
          fi
