name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        id: check
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://congress.trade/health || echo "000")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on failure
        if: steps.check.outputs.status == 'fail'
        run: |
          title="Uptime Alert: congress.trade health returned HTTP ${{ steps.check.outputs.http_code }}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label incident --search "congress.trade health" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Health check is still failing at $(date -u). HTTP status: ${{ steps.check.outputs.http_code }}."
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label "incident" \
              --body "Health check failed at $(date -u). HTTP status: ${{ steps.check.outputs.http_code }}."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
