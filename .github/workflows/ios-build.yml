name: iOS build (Mac runner)

# Compile AND run the 71 CongressTradeTests cases on the self-hosted Mac runner.
# A broken compile or a failing XCTest must fail this job (never continue-on-error).
#
# The required-check job name is `xcodebuild (unsigned)`.  That job always
# reports on pull_request (no paths: filter on that event) so GitHub can
# require it without blocking backend-only PRs.  The Mac work stays behind
# an iOS-path gate.
#
# XCODE BUILDS ONLY (owner directive, 2026-08-12): the Mac labels are only
# used by the compile+test job below.  Backend typecheck/test/lint stay on
# hetzner/ubuntu.
#
# Why this exists: version 1.0 was rejected as INVALID_BINARY twice, and the
# box carries stable Xcode 26.x and Xcode-beta 27 side by side.  A binary
# built against the beta SDK passes TestFlight upload but fails App Store
# submission.  CI pins DEVELOPER_DIR to stable and ASSERTS the version.
#
# Deliberately unsigned for the device compile, and no archive/upload —
# TestFlight shipping stays in scripts/ios-ship-testflight.sh.
#
# Required-check follow-up (Jay/ASC — after this workflow is on main):
# Settings → Branches → main → Require status checks to pass → add
# `xcodebuild (unsigned)`.  Do not add it before this lands: a path-filtered
# job as a required check blocks every non-iOS PR.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  # Cancel superseded PR runs only.  Rapid pushes to main must not drop the
  # last compile+test signal (IOSENGINEERING-14: two main runs cancelled
  # 2026-08-16 while the branch was still red).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: ios path gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Decide whether Mac compile+test must run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "ios=1" >> "$GITHUB_OUTPUT"
            echo "${EVENT}: path filter already applied or dispatch; run Mac compile+test."
            exit 0
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "ios=1" >> "$GITHUB_OUTPUT"
            echo "pull_request missing base sha; fail-closed and run Mac compile+test."
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -E '^(clients/ios/|\.github/workflows/ios-build\.yml$)'; then
            echo "ios=1" >> "$GITHUB_OUTPUT"
            echo "iOS paths changed; Mac compile+test required."
          else
            echo "ios=0" >> "$GITHUB_OUTPUT"
            echo "no iOS paths; required check is green without a Mac run."
          fi

  build:
    name: xcodebuild-mac
    needs: decide
    if: >-
      needs.decide.outputs.ios == '1' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, xcode26]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Assert stable Xcode 26 (never beta)
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          case "$ver" in
            26.*) echo "stable Xcode $ver — OK" ;;
            *)
              echo "::error::Expected stable Xcode 26.x, got '$ver'. A beta-SDK build passes TestFlight but is rejected at App Store submission as INVALID_BINARY."
              exit 1
              ;;
          esac
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac

      - name: Build CongressTrade (generic iOS device, unsigned)
        run: |
          xcodebuild build \
            -project clients/ios/CongressTrade.xcodeproj \
            -scheme CongressTrade \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test CongressTrade (simulator XCTest, do not skip)
        run: |
          set -euo pipefail
          dest=""
          for name in "iPhone 17 Pro" "iPhone 16 Pro"; do
            if xcrun simctl list devices available | grep -F "$name (" >/dev/null; then
              dest="platform=iOS Simulator,name=${name}"
              echo "Using destination: ${dest}"
              break
            fi
          done
          if [ -z "$dest" ]; then
            echo "::error::No approved iOS Simulator (iPhone 17 Pro or iPhone 16 Pro) is available. XCTest must run; do not skip."
            xcrun simctl list devices available
            exit 1
          fi

          result="${RUNNER_TEMP}/CongressTrade.xcresult"
          rm -rf "$result"
          # Simulator XCTest needs a runnable TEST_HOST.  Do not pass
          # CODE_SIGNING_ALLOWED=NO here — that is only for the device compile
          # above.  A missing simulator or a failed case still exits non-zero.
          xcodebuild test \
            -project clients/ios/CongressTrade.xcodeproj \
            -scheme CongressTrade \
            -destination "$dest" \
            -only-testing:CongressTradeTests \
            -resultBundlePath "$result" \
            | tee "${RUNNER_TEMP}/xcodebuild-test.log"

          executed="$(
            grep -E "Executed [0-9]+ tests?" "${RUNNER_TEMP}/xcodebuild-test.log" \
              | tail -1 \
              | awk '{print $2}'
          )"
          executed="${executed:-0}"
          if [ "$executed" -lt 71 ]; then
            echo "::error::Expected at least 71 XCTest cases in CongressTradeTests; executed ${executed}. Do not skip tests."
            exit 1
          fi
          echo "Executed ${executed} XCTest cases."

      - name: Upload XCTest result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: congress-trade-ios-xcresult
          path: ${{ runner.temp }}/CongressTrade.xcresult
          if-no-files-found: warn
          retention-days: 14

  # Always-present status.  This is the context to tick required after merge.
  # If it needed: the Mac job, a red compile or XCTest makes this red too.
  report:
    name: xcodebuild (unsigned)
    needs: [decide, build]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when Mac compile or XCTest failed
        env:
          IOS: ${{ needs.decide.outputs.ios }}
          DECIDE: ${{ needs.decide.result }}
          MAC: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "decide=${DECIDE} ios=${IOS} mac=${MAC}"
          if [ "$DECIDE" != "success" ]; then
            echo "::error::iOS path gate did not succeed; fail closed."
            exit 1
          fi
          if [ "$IOS" = "0" ]; then
            echo "No iOS paths on this PR; required check is green without a Mac run."
            exit 0
          fi
          if [ "$IOS" != "1" ]; then
            echo "::error::iOS path gate did not vote; fail closed."
            exit 1
          fi
          if [ "$MAC" = "success" ]; then
            echo "Mac compile + XCTest succeeded."
            exit 0
          fi
          echo "::error::iOS compile or XCTest failed (mac job result=${MAC}). This required check is red."
          exit 1
