name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 10 * * 1"

jobs:
  gitleaks:
    # Use the same resource-guarded Coolify runner as CI when configured. This
    # keeps the required check independent of GitHub-hosted Actions billing.
    # Dependabot PRs stay on GitHub-hosted infrastructure because dependency
    # install/security tooling must not run on the production-hosting box.
    # If the self-hosted runner is unavailable, clearing CT_CI_RUNNER restores
    # the GitHub-hosted fallback.
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.CT_CI_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run security scans."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Untrusted bot PRs cannot run security scans (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean stale gitleaks installer temp files
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="${TMPDIR:-/tmp}"
          tmp_root="${tmp_root%/}"
          rm -f "$tmp_root/gitleaks.tmp"
          rm -rf "$tmp_root/gitleaks-8.24.3"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's SARIF artifact upload assumes $HOME is the artifact
          # root; the Coolify runner's workspace is mounted elsewhere. The
          # scan and PR comments remain enabled; disable only that optional
          # upload when CT_CI_RUNNER selects self-hosted execution.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: ${{ vars.CT_CI_RUNNER && 'false' || 'true' }}
