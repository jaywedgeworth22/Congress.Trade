name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 10 * * 1"

jobs:
  gitleaks:
    # Do not schedule fork PRs on the persistent self-hosted runner. The
    # in-job bot gate below remains defense in depth for same-repo bot actors.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Runner selection with a hosted escape hatch. When repo variable
    # CT_CI_RUNNER is set (normally `congress-ci`) jobs run on the Coolify
    # box at $0. Clearing it falls back to GitHub-hosted runners:
    #   gh variable set CT_CI_RUNNER --body ""     # -> ubuntu-latest (paid, always available)
    #   gh variable set CT_CI_RUNNER --body congress-ci   # -> self-hosted ($0)
    # This valve exists because the required merge checks live in this file:
    # when the box's egress degrades (observed 2026-07-19: every job dying in
    # "Set up job" on `Failed to download action .../actions/setup-node`,
    # HttpClient.Timeout after 3 attempts) merges block repo-wide with no way
    # out. Dependabot never resolves to the persistent runner regardless.
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.CT_CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run security scans."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Untrusted bot PRs cannot run security scans (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Clean stale gitleaks installer temp files
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="${TMPDIR:-/tmp}"
          tmp_root="${tmp_root%/}"
          rm -f "$tmp_root/gitleaks.tmp"
          rm -rf "$tmp_root/gitleaks-8.24.3"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Avoid the action's GitHub artifact upload path and storage charge;
          # the scan result and PR annotations remain enabled.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
