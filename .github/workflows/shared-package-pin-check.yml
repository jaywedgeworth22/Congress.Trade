name: Shared package pin check

# Guards against @jaywedgeworth22/congress-trading-shared drifting between its two consumers:
# App A = Congress.Trade (this repo, spec in app/package-lock.json) and App B = Socratic.Trade (spec in
# package-lock.json). Both must install the SAME resolved version so the contract they compile against
# cannot silently diverge. The OLD version of this check only compared a range-stripped lower bound from
# package.json and no-oped on missing peer dep -- so it could not catch the "^1.0.0 in one repo vs a
# newer resolved version in the other" drift this workflow now covers.
#
# What it does:
#   1. Reads THIS repo's actually installed version from app/package-lock.json.
#   2. Fetches the PEER repo's actually installed version from package-lock.json via the GitHub API.
#   3. FAILS (exit 1) when the two exact resolved versions differ -- the divergence guard. Also fails
#      hard when the peer dependency is missing from either lockfile. Run it on demand
#      (workflow_dispatch) for a dry-run, or let it run on PRs / weekly.
#
# Requires the GH_PACKAGES_TOKEN repo secret: a PAT with read access to the private
# jaywedgeworth22/congress-trading-shared AND jaywedgeworth22/Socratic.Trade repos. Without it the peer
# comparison is skipped with a notice (the default GITHUB_TOKEN cannot read other private repos), so an
# unauthenticated run never hard-fails.
#
# NOTE: this workflow is intentionally NOT part of the branch-protection ruleset, so a red result flags
# divergence loudly without hard-blocking a coordinated two-repo bump (bump one repo, open its PR, then
# the other). Promote it to a required check once bumps always land as a matched pair.
#
# Keep this file ASCII-only (AGENTS.md) -- no em dashes / arrows near shell $VARs.

on:
  pull_request:
    paths:
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/shared-package-pin-check.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # Mondays
  workflow_dispatch:

env:
  PKG: '@jaywedgeworth22/congress-trading-shared'
  PEER_REPO: jaywedgeworth22/Socratic.Trade
  LOCAL_PACKAGE_LOCK_PATH: app/package-lock.json
  PEER_PACKAGE_LOCK_PATH: package-lock.json

jobs:
  check-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare shared-package version against the peer consumer
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail

          # Resolve the actually installed version from a package-lock.json.
          resolve_installed() {
            local LOCKFILE="$1"
            node -e "const pkg = require('./${LOCKFILE}'); console.log(pkg.packages['node_modules/${PKG}']?.version || '')"
          }

          LOCAL_V=$(resolve_installed "${LOCAL_PACKAGE_LOCK_PATH}")
          if [ -z "$LOCAL_V" ]; then
            echo "::error::${PKG} not installed (missing from ${LOCAL_PACKAGE_LOCK_PATH})"
            exit 1
          fi
          echo "Local installed version (${LOCAL_PACKAGE_LOCK_PATH}): $LOCAL_V"

          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::GH_PACKAGES_TOKEN is unset - skipping the peer divergence check (it needs read access to ${PEER_REPO})."
            exit 0
          fi

          # Fetch the peer repo's package-lock.json raw (Accept: raw returns file content, not base64).
          if ! PEER_LOCK_JSON=$(gh api "repos/${PEER_REPO}/contents/${PEER_PACKAGE_LOCK_PATH}" -H "Accept: application/vnd.github.raw" 2>/dev/null); then
            echo "::warning::could not fetch ${PEER_REPO}/${PEER_PACKAGE_LOCK_PATH} (auth/scope/transient error) - skipping peer check"
            exit 0
          fi
          PEER_V=$(printf '%s' "$PEER_LOCK_JSON" | PKG="$PKG" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log((JSON.parse(s).packages||{})['node_modules/'+process.env.PKG]?.version||'')}catch{console.log('')}})")
          if [ -z "$PEER_V" ]; then
            echo "::error::${PKG} not installed (missing from ${PEER_REPO}/${PEER_PACKAGE_LOCK_PATH})"
            exit 1
          fi
          echo "Peer installed version (${PEER_REPO}/${PEER_PACKAGE_LOCK_PATH}): $PEER_V"

          if [ "$LOCAL_V" = "$PEER_V" ]; then
            echo "OK: both consumers install ${PKG}@${LOCAL_V}."
          else
            echo "::error::${PKG} version DIVERGED: this repo installs version '${LOCAL_V}' but ${PEER_REPO} installs version '${PEER_V}'. Bump BOTH repos to the same exact version (bump them as a matched pair)."
            exit 1
          fi
