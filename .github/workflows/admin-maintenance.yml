# Owner-triggered production maintenance against the live Worker's admin API.
# Uses the same ADMIN_TOKEN repo secret as deploy.yml/ship.sh — this is the
# sanctioned path for authorized admin calls from automation (cloud agent
# sessions hold no admin credentials by design).
#
# Tasks:
#   drain-backlog          -> both steps below, in order
#   ingest-requeue-failed  -> reopen dead-lettered ingestion_outbox rows
#                             (fetch-stage casualties, e.g. the R2 known-length
#                             regression); the per-minute outbox flush re-fetches
#   ingest-retry-errored   -> re-enqueue filing.fetched for errored filings that
#                             already have raw bytes (extraction-stage casualties)
#   batch-status           -> poll and resolve one explicitly identified batch job
name: Admin Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task
        required: true
        type: choice
        default: drain-backlog
        options:
          - drain-backlog
          - ingest-requeue-failed
          - ingest-retry-errored
          - batch-status
      job_id:
        description: Required UUID-like batch job id when task is batch-status
        required: false
        type: string
      confirm:
        description: Type run-production-maintenance to confirm
        required: true

# Serialize production maintenance with deploys and let the in-flight operation
# finish instead of cancelling it mid-mutation.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      inputs.confirm == 'run-production-maintenance' &&
      github.ref == 'refs/heads/main'
    environment: production
    # Self-hosted like deploy.yml: Cloudflare serves GitHub's hosted (Azure)
    # runners a managed bot challenge before requests reach the Worker, so
    # admin curls must come from the same runner ship.sh already uses.
    runs-on: [self-hosted, congress-deploy]
    timeout-minutes: 15
    env:
      BASE_URL: https://congress.trade
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      # The self-hosted runner's curl predates --fail-with-body, so capture the
      # body and status code separately and fail on non-200 by hand.
      - name: Requeue dead-lettered fetches (ingestion_outbox failed -> pending)
        if: inputs.task == 'drain-backlog' || inputs.task == 'ingest-requeue-failed'
        run: |
          set -euo pipefail
          echo "== POST /api/admin/ingest-requeue-failed"
          code=$(curl -sS -o /tmp/requeue.json -w '%{http_code}' -X POST "$BASE_URL/api/admin/ingest-requeue-failed" \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            -H 'content-type: application/json' -d '{}')
          cat /tmp/requeue.json; echo
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }

      - name: Re-enqueue errored filings that already have raw bytes
        if: inputs.task == 'drain-backlog' || inputs.task == 'ingest-retry-errored'
        run: |
          set -euo pipefail
          echo "== POST /api/admin/ingest-retry-errored"
          code=$(curl -sS -o /tmp/retry.json -w '%{http_code}' -X POST "$BASE_URL/api/admin/ingest-retry-errored" \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            -H 'content-type: application/json' -d '{"limit": 2000}')
          cat /tmp/retry.json; echo
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }

      - name: Poll and resolve one batch job
        if: inputs.task == 'batch-status'
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          if ! [[ "$JOB_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "::error::job_id must be a UUID-like value"
            exit 2
          fi
          response_file=$(mktemp "${TMPDIR:-/tmp}/ct-batch-status.XXXXXX")
          chmod 600 "$response_file"
          trap 'rm -f "$response_file"' EXIT
          echo "== POST /api/admin/batch-status/<validated-job-id>"
          code=$(curl -sS -o "$response_file" -w '%{http_code}' -X POST \
            "$BASE_URL/api/admin/batch-status/$JOB_ID" \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            -H 'content-type: application/json' -d '{}')
          python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  payload = json.load(handle)
          except Exception:
              print(json.dumps({"response": "unparseable"}, sort_keys=True))
              raise SystemExit(0)

          safe = {
              key: payload[key]
              for key in ("jobId", "status", "alreadyFinished", "turnaroundMs", "turnaroundMin")
              if key in payload
          }
          summary = payload.get("summary")
          if isinstance(summary, dict):
              errors = summary.get("errors")
              safe["summary"] = {
                  key: summary[key]
                  for key in (
                      "docs", "expectedDocs", "returnedDocs", "missingDocs",
                      "providerStatus", "ok", "rows",
                  )
                  if key in summary
              }
              reported_error_count = summary.get("errorCount")
              safe["summary"]["errorCount"] = (
                  reported_error_count
                  if isinstance(reported_error_count, int) and reported_error_count >= 0
                  else len(errors) if isinstance(errors, list) else 0
              )
          if "error" in payload:
              safe["error"] = "request failed"
          print(json.dumps(safe, sort_keys=True))
          PY
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
